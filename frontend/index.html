<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover lets the app use the full screen on a notched phone; the shell pads for the safe areas. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Quantfolio</title>
    <meta name="color-scheme" content="dark" />
    <!-- The app is dark-only, so both schemes get the same bar colour. -->
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Quantfolio" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>html { background: #0a0a0a; }</style>
  </head>
  <body class="bg-[#0a0a0a] text-[#fafafa]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
