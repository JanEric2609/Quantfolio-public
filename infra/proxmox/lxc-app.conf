# Proxmox LXC Container for QuantFolio Application
# FastAPI + APScheduler (single-process per Phase 9 L28)
# Memory: 2 GB RAM
# Storage: 20 GB

hostname: quantfolio-api
description: QuantFolio FastAPI + APScheduler
ostype: debian
osversion: 12

# Resource allocation
cores: 4
memory: 2048
swap: 512
disk: 20

# Network (bridge: vmbr0 for your network)
net0: name=eth0,bridge=vmbr0,gw=10.0.0.1,ip=10.0.0.21/24,type=veth

# Storage
rootfs: local-lvm:vm-111-disk-0,size=20G

# Optional: CPU limits
cpulimit: 4

# Initialization
template: debian-12-standard_12.0-1_amd64

# Add to Proxmox via:
# pct create <VMID> <STORAGE>:<ISO> <CONFIG_FILE>
# Example: pct create 111 local-lvm debian-12-standard_12.0-1_amd64.tar.zst --hostname quantfolio-api

# After creation:
# - Install Python 3.11+, pip, virtualenv
# - Copy app code to /opt/quantfolio
# - Install dependencies via pip install -e ".[dev]"
# - Enable quantfolio-api.service via systemd
