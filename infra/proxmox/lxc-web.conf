# Proxmox LXC Container for QuantFolio Web Reverse Proxy
# Caddy reverse proxy with TLS
# Memory: 2 GB RAM
# Storage: 10 GB

hostname: quantfolio-web
description: QuantFolio Caddy Reverse Proxy
ostype: debian
osversion: 12

# Resource allocation
cores: 2
# memory bumped from 512 -> 2048: headroom for the Vite/tsc frontend build now run on the web LXC
memory: 2048
swap: 1024
disk: 10

# Network (bridge: vmbr0 for your network)
# This container should have a static IP and be exposed to the network
net0: name=eth0,bridge=vmbr0,gw=10.0.0.1,ip=10.0.0.23/24,type=veth

# Storage
rootfs: local-lvm:vm-113-disk-0,size=10G

# Optional: CPU limits
cpulimit: 2

# Initialization
template: debian-12-standard_12.0-1_amd64

# Add to Proxmox via:
# pct create <VMID> <STORAGE>:<ISO> <CONFIG_FILE>
# Example: pct create 113 local-lvm debian-12-standard_12.0-1_amd64.tar.zst --hostname quantfolio-web

# After creation:
# 1. apt-get install caddy
# 2. Copy Caddyfile to /etc/caddy/
# 3. systemctl enable --now caddy
# 4. Verify: curl https://your-domain.com (should proxy to http://quantfolio-api:8000)

# Port Forwarding (on Proxmox host or home router):
# - Forward 80/tcp to 10.0.0.23:80
# - Forward 443/tcp to 10.0.0.23:443
