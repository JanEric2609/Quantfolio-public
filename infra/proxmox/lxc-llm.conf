# Proxmox LXC Container for QuantFolio LLM Server
# llama.cpp with GPU passthrough (Qwen3.5-9B-UD-Q4_K_XL, hybrid DeltaNet)
# Memory: 8 GB RAM (model fits fully in VRAM; system RAM for OS + process overhead only)
# Storage: 100 GB (for model + cache)
# GPU: PCI device passthrough (e.g. RTX 8GB)

hostname: quantfolio-llm
description: QuantFolio llama.cpp with GPU passthrough
ostype: debian
osversion: 12

# Resource allocation
cores: 8
memory: 8192
swap: 2048
disk: 100

# Network (bridge: vmbr0 for your network)
net0: name=eth0,bridge=vmbr0,gw=10.0.0.1,ip=10.0.0.22/24,type=veth

# Storage
rootfs: local-lvm:vm-112-disk-0,size=100G

# GPU Passthrough (requires Proxmox host IOMMU configuration)
# Uncomment and adjust to your GPU's PCI ID (get via `lspci | grep -i vga`)
# Example for NVIDIA RTX 3060 at 01:00.0:
# hostpci0: 01:00.0

# Optional: CPU limits
cpulimit: 8

# Initialization
template: debian-12-standard_12.0-1_amd64

# Add to Proxmox via:
# pct create <VMID> <STORAGE>:<ISO> <CONFIG_FILE>
# Example: pct create 112 local-lvm debian-12-standard_12.0-1_amd64.tar.zst --hostname quantfolio-llm

# After creation (from Proxmox host):
# 1. Copy quantfolio-llamacpp.service to /etc/systemd/system/
# 2. Install llama.cpp dependencies: apt-get install cmake build-essential
# 3. Download model: huggingface-cli download unsloth/Qwen3.5-9B-GGUF Qwen3.5-9B-UD-Q4_K_XL.gguf \
#      --local-dir /var/lib/quantfolio/models/
# 4. systemctl enable --now quantfolio-llamacpp.service
# 5. Verify: curl http://10.0.0.22:8080/health
