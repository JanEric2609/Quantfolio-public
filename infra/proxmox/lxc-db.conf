# Proxmox LXC Container for QuantFolio Database
# PostgreSQL 16 + TimescaleDB + pgvector
# Memory: 4 GB RAM
# Storage: 50 GB

hostname: quantfolio-db
description: QuantFolio PostgreSQL + TimescaleDB + pgvector
ostype: debian
osversion: 12

# Resource allocation
cores: 4
memory: 4096
swap: 1024
disk: 50

# Network (bridge: vmbr0 for your network)
net0: name=eth0,bridge=vmbr0,gw=10.0.0.1,ip=10.0.0.20/24,type=veth

# Storage
rootfs: local-lvm:vm-110-disk-0,size=50G

# Optional: CPU limits
cpulimit: 4

# Initialization
template: debian-12-standard_12.0-1_amd64

# Add to Proxmox via:
# pct create <VMID> <STORAGE>:<ISO> <CONFIG_FILE>
# Example: pct create 110 local-lvm debian-12-standard_12.0-1_amd64.tar.zst --hostname quantfolio-db
